name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - "skill/**"
      - "adapter/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: format-monograph/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r format-monograph/requirements.txt
      - name: Compile scripts
        run: python -m compileall -q format-monograph/scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  skill-spec:
    name: Agent Skills specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate portable skill
        run: skills-ref validate format-monograph
